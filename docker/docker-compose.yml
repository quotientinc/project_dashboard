services:
  qpd:
    image: qpd:${QPD_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ${QPD_DATA_DIR:-./data}:/app/data
    restart: always
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
